<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OTP Verification</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#f4f7fc;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.otp-box{
  background:white;
  width:100%;
  max-width:400px;
  padding:40px;
  border-radius:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#0d47a1;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:20px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:18px;
  text-align:center;
  letter-spacing:3px;
}

button{
  width:100%;
  padding:12px;
  background:#0d47a1;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  background:#08306b;
}

.message{
  text-align:center;
  margin-top:20px;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="otp-box">

<h1>📱 OTP Verification</h1>

<input
  type="text"
  id="otp"
  placeholder="Enter OTP"
  maxlength="6"
>

<button onclick="verifyOTP()">
  Verify OTP
</button>

<p id="message" class="message"></p>

</div>

<script>

async function verifyOTP(){

  const otp =
    document.getElementById("otp").value;

  const email =
    localStorage.getItem("email");

  console.log("EMAIL:", email);
  console.log("OTP:", otp);

  if(!email){

    document.getElementById(
      "message"
    ).innerText =
      "❌ Email not found. Register again.";

    document.getElementById(
      "message"
    ).style.color = "red";

    return;
  }

  try{

    const response = await fetch(

      "https://disaster-system-backend.onrender.com/verify-otp",

      {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          email,
          otp

        })

      }

    );

    const data =
      await response.json();

    document.getElementById(
      "message"
    ).innerText =
      data.message;

    if(data.success){

      document.getElementById(
        "message"
      ).style.color =
        "green";

      setTimeout(()=>{

        window.location.href =
          "login.html";

      },1500);

    }else{

      document.getElementById(
        "message"
      ).style.color =
        "red";
    }

  }

  catch(error){

    console.log(error);

    document.getElementById(
      "message"
    ).innerText =
      "❌ Server Error";
  }

}

</script>

</body>
</html>
