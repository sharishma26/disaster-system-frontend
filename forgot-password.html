<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Forgot Password</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Poppins', sans-serif;

      background:#f4f7fc;

      display:flex;

      justify-content:center;

      align-items:center;

      height:100vh;
    }

    .forgot-box{

      background:white;

      padding:40px;

      width:100%;

      max-width:400px;

      border-radius:15px;

      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    h1{

      text-align:center;

      color:#0d47a1;

      margin-bottom:25px;
    }

    input{

      width:100%;

      padding:12px;

      margin-bottom:20px;

      border-radius:8px;

      border:1px solid #ccc;

      font-size:15px;
    }

    button{

      width:100%;

      padding:12px;

      background:#0d47a1;

      color:white;

      border:none;

      border-radius:8px;

      font-size:16px;

      cursor:pointer;
    }

    button:hover{

      background:#08306b;
    }

    .message{

      margin-top:20px;

      text-align:center;

      color:green;
    }
    @media(max-width:768px){

  body{

    padding:15px;
  }

  .container,
  .login-box,
  .register-box,
  .forgot-box,
  .reset-box{

    width:100%;

    padding:25px;
  }

  h1{

    font-size:28px;
  }

  .stats-grid,
  .tips-grid,
  .shelter-grid,
  .emergency-section{

    grid-template-columns:1fr;
  }

  button{

    font-size:14px;
  }
}

  </style>

</head>

<body>

  <div class="forgot-box">

    <h1>🔑 Forgot Password</h1>

    <input
      type="email"
      id="email"
      placeholder="Enter Registered Email"
    >

    <button onclick="resetPassword()">

      Send Reset Link

    </button>

    <p class="message"
       id="message"></p>

  </div>

<script>

async function resetPassword(){

  const email =
    document.getElementById("email").value;

  if(!email){

    alert("❌ Please enter email");
    return;
  }

  try{

    const response = await fetch(
      "https://disaster-system-backend.onrender.com/forgot-password",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body: JSON.stringify({
          email
        })
      }
    );

    const result =
  await response.json();

console.log(result);

alert(JSON.stringify(result));

document.getElementById("message").innerText =
  result.message || "No message received";

    if(result.success){

      setTimeout(() => {

        window.location.href =
          "reset.html";

      }, 2000);

    }

  }

  catch(error){

    console.log(error);

    alert("❌ Failed to send reset request");

  }

}

</script>
</body>

</html>
