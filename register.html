<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>User Registration</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Poppins', sans-serif;

      background:#f4f7fc;

      display:flex;

      justify-content:center;

      align-items:center;

      min-height:100vh;

      padding:20px;
    }

    .register-container{

      background:white;

      width:100%;

      max-width:450px;

      padding:40px;

      border-radius:15px;

      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    h1{

      text-align:center;

      color:#0d47a1;

      margin-bottom:25px;
    }

    input{

      width:100%;

      padding:12px;

      margin-bottom:20px;

      border-radius:8px;

      border:1px solid #ccc;

      font-size:15px;
    }

    button{

      width:100%;

      padding:12px;

      background:#0d47a1;

      color:white;

      border:none;

      border-radius:8px;

      font-size:16px;

      cursor:pointer;
    }

    button:hover{

      background:#08306b;
    }

    .login-link{

      text-align:center;

      margin-top:20px;
    }

    .login-link a{

      color:#0d47a1;

      text-decoration:none;

      font-weight:bold;
    }
    @media(max-width:768px){

  body{

    padding:15px;
  }

  .container,
  .login-box,
  .register-box,
  .forgot-box,
  .reset-box{

    width:100%;

    padding:25px;
  }

  h1{

    font-size:28px;
  }

  .stats-grid,
  .tips-grid,
  .shelter-grid,
  .emergency-section{

    grid-template-columns:1fr;
  }

  button{

    font-size:14px;
  }
}

  </style>

</head>

<body>

  <div class="register-container">

    <h1>📝 User Registration</h1>

    <form id="registerForm">

      <input
        type="text"
        id="username"
        placeholder="Enter Full Name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Enter Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        required
      >
       <button type="submit">      
        Register

       </button>

    </form>

    <div class="login-link">

      Already have an account?

      <a href="login.html">

        Login
      </a>

    </div>

  </div>

<script src="register.js"></script>
</body>

</html>
